[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --cov --cov-report=term-missing:skip-covered --cov-report=html"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "*/factories.py",
    "conftest.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
